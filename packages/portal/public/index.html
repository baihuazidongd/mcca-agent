<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mcca · portal</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='12' fill='%23FAF9F5' stroke='%231F1E1D' stroke-width='4'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='32' text-anchor='middle' fill='%23C15F3C'%3EM%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Apply persisted/system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("mcca-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/vendor/xterm.css" />
  </head>

  <body>
    <div id="root"></div>
    <script src="/vendor/react.js"></script>
    <script src="/vendor/react-dom.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
