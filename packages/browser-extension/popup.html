<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>MCCA 浏览器</title><style>body{font:14px system-ui;width:310px;padding:12px;background:#18211f;color:#eee}input,button{box-sizing:border-box;width:100%;padding:9px;margin:5px 0}p{white-space:pre-wrap;overflow-wrap:anywhere}</style><h3>MCCA 个人浏览器</h3><p>只允许所选标签页。浏览器显示调试提示时，可以随时取消控制。</p><label>工作台端口<input id="port" type="number" value="3470"></label><label>工作台生成的配对码<input id="code" autocomplete="off"></label><button id="pair">配对 / 重新连接</button><button id="allow">允许当前标签页</button><button id="deny">撤回当前标签页</button><button id="disconnect">断开全部标签页</button><p id="status" role="status"></p><script src="popup.js"></script></html>
