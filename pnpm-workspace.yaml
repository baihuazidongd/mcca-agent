packages:
  - "packages/*"
  - "mcp/*"
  - "desktop"

# These transitive dependencies ship build scripts we do not need (Google GenAI
# SDK / protobufjs codegen). Declining their builds keeps `pnpm install` from
# failing on the ignored-builds check.
allowBuilds:
  '@google/genai': false
  esbuild: true
  node-pty: true
  protobufjs: false

minimumReleaseAgeExclude:
  - '@earendil-works/chord@0.85.1'
  - '@earendil-works/pi-agent-core@0.85.1'
  - '@earendil-works/pi-ai@0.85.1'
  - '@earendil-works/pi-coding-agent@0.85.1'
  - '@earendil-works/pi-telemetry@0.85.1'
  - '@earendil-works/pi-tui@0.85.1'
